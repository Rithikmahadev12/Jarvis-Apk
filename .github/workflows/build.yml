name: Build Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x JarvisAndroid/JarvisAndroid/gradlew

      - name: Build debug APK
        working-directory: JarvisAndroid/JarvisAndroid
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-APK
          path: JarvisAndroid/JarvisAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
